[project]
name = "gas-agent"
version = "0.1.0"
description = "Discord agent：用 claude -p 看汽機車儀表板／加油收據／保養單照片，分人記帳並計算油耗與花費"
authors = [
    { name = 'LENOVO-GRACE\Grace', email = "411333027@gms.ndhu.edu.tw" }
]
requires-python = ">=3.12"
dependencies = [
    "discord-py>=2.7.1",
    "matplotlib>=3.11.2",
    "openpyxl>=3.1.5",
    "pillow>=13.0.0",
    "python-dotenv>=1.2.4",
    "tzdata>=2026.5",
]

[project.scripts]
gas-agent = "gas_agent.main:main"
car = "gas_agent.main:main"  # 短一點的別名：uv run car

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
